apiVersion: apps/v1
kind: Deployment
metadata:
  name: chillnet-app
  namespace: chillnet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chillnet-app
  template:
    metadata:
      labels:
        app: chillnet-app
    spec:
      initContainers:
        # Attend que MySQL accepte les connexions avant de démarrer PHP.
        - name: wait-for-mysql
          image: mysql:8.0
          command:
            - sh
            - -c
            - until mysqladmin ping -h mysql -u"$DB_USERNAME" -p"$DB_PASSWORD" --silent; do echo "attente de MySQL..."; sleep 3; done
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: chillnet-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chillnet-secrets
                  key: DB_PASSWORD
      containers:
        - name: app
          image: 192.168.56.12:5000/chillnet-app:latest
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: chillnet-config
            - secretRef:
                name: chillnet-secrets
          readinessProbe:
            httpGet:
              path: /up
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /up
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
