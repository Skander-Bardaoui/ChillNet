# Les artefacts scikit-learn (model.joblib, metadata.json) et les CSV sont
# embarqués dans l'image : aucun volume n'est monté sur /app/artifacts ou
# /app/data, sinon ils seraient masqués par un volume vide (repli sur les règles).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: chillnet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: 192.168.56.12:5000/chillnet-ai-service:latest
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: AI_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: chillnet-secrets
                  key: AI_SERVICE_TOKEN
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
