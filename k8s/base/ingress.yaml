apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chillnet
  namespace: chillnet
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: chillnet.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chillnet-app
                port:
                  number: 80
