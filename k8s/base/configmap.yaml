apiVersion: v1
kind: ConfigMap
metadata:
  name: chillnet-config
  namespace: chillnet
data:
  APP_NAME: "ChillNet"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "http://chillnet.local"
  APP_LOCALE: "fr"
  APP_FALLBACK_LOCALE: "fr"

  LOG_CHANNEL: "stderr"
  LOG_LEVEL: "warning"

  DB_CONNECTION: "mysql"
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_DATABASE: "chillnet"

  SESSION_DRIVER: "database"
  SESSION_LIFETIME: "120"
  CACHE_STORE: "database"
  QUEUE_CONNECTION: "database"
  FILESYSTEM_DISK: "local"
  BROADCAST_CONNECTION: "log"
  MAIL_MAILER: "log"

  # Microservice IA (voir config/ai.php) — joint via le Service interne.
  AI_SERVICE_ENABLED: "true"
  AI_SERVICE_URL: "http://ai-service:8001"
  AI_SERVICE_TIMEOUT: "2.0"
  AI_DRIVER: "local"
