<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="t">
  <title id="t">ChillNet — Heatwave vigilance &amp; neighbourhood solidarity</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08080C"/>
      <stop offset="55%" stop-color="#0B0B12"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5E9">
        <animate attributeName="stop-color" values="#0EA5E9;#38BDF8;#0EA5E9" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#0EA5E9;#38BDF8" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="orbA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="300" fill="url(#bg)"/>
  <rect width="1280" height="300" fill="url(#grid)"/>

  <g>
    <circle cx="1080" cy="60" r="190" fill="url(#orbA)">
      <animate attributeName="opacity" values="0.55;0.95;0.55" dur="9s" repeatCount="indefinite"/>
    </circle>
    <animateTransform attributeName="transform" type="translate" values="0 0; -26 14; 0 0" dur="16s" repeatCount="indefinite"/>
  </g>
  <g>
    <circle cx="190" cy="260" r="150" fill="url(#orbB)">
      <animate attributeName="opacity" values="0.35;0.7;0.35" dur="11s" repeatCount="indefinite"/>
    </circle>
    <animateTransform attributeName="transform" type="translate" values="0 0; 30 -18; 0 0" dur="18s" repeatCount="indefinite"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <g>
      <circle cx="66" cy="58" r="5" fill="#0EA5E9">
        <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="84" y="64" font-size="13" letter-spacing="4" fill="#9CA3AF">SKANDER BARDAOUI</text>
    </g>
    <text x="62" y="146" font-size="58" font-weight="700" fill="#F8FAFC">ChillNet</text>
    <text x="64" y="191" font-size="22" fill="#CBD5E1">Heatwave vigilance &amp; neighbourhood solidarity</text>
    <g><rect x="64" y="232" rx="16" width="86" height="34" fill="rgba(255,255,255,0.06)" stroke="#0EA5E9" stroke-opacity="0.45"/><text x="107.0" y="254" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#E5E7EB" fill-opacity="0.9">Laravel</text></g><g><rect x="162" y="232" rx="16" width="86" height="34" fill="rgba(255,255,255,0.06)" stroke="#0EA5E9" stroke-opacity="0.45"/><text x="205.0" y="254" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#E5E7EB" fill-opacity="0.9">PHP</text></g><g><rect x="260" y="232" rx="16" width="86" height="34" fill="rgba(255,255,255,0.06)" stroke="#0EA5E9" stroke-opacity="0.45"/><text x="303.0" y="254" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#E5E7EB" fill-opacity="0.9">Python</text></g><g><rect x="358" y="232" rx="16" width="110" height="34" fill="rgba(255,255,255,0.06)" stroke="#0EA5E9" stroke-opacity="0.45"/><text x="413.0" y="254" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#E5E7EB" fill-opacity="0.9">PostgreSQL</text></g>
  </g>

  <rect x="0" y="292" width="320" height="4" fill="url(#accent)" rx="2">
    <animate attributeName="x" values="-320;1280" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;1;0.25" dur="9s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="297" width="1280" height="1" fill="#FFFFFF" fill-opacity="0.08"/>
</svg>
