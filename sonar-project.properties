# --- ChillNet — analyse SonarQube de l'application Laravel ---
sonar.projectKey=chillnet
sonar.projectName=ChillNet
sonar.projectVersion=1.0

# Surchargé par le pipeline (withSonarQubeEnv) ; valeur par défaut pour un run local.
sonar.host.url=http://192.168.56.11:9000

sonar.sources=app,routes,database,config,resources
sonar.tests=tests
sonar.exclusions=vendor/**,node_modules/**,storage/**,bootstrap/cache/**,public/**,docs/**,k8s/**,jenkins/**,ai-service/**,tests/fixtures/**
sonar.coverage.exclusions=config/**,database/**,routes/**,app/Console/**,app/Enums/**,app/Providers/**

# Rapports produits par la CI (voir Jenkinsfile).
sonar.php.coverage.reportPaths=build/coverage/clover.xml
sonar.php.tests.reportPath=build/coverage/junit.xml

sonar.sourceEncoding=UTF-8
